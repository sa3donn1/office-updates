{% extends "base.html" %}

{% block title %}إضافة عميل جديد - نظام الأرشيف المكتبي{% endblock %}

{% block content %}
<div class="page-header">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h1 class="mb-0">
                <i class="bi bi-person-plus me-3"></i>
                إضافة عميل جديد
            </h1>
            <p class="mb-0 mt-2">إضافة بيانات عميل جديد للنظام</p>
        </div>
        <a href="{{ url_for("clients.index") }}" class="btn btn-light">
            <i class="bi bi-arrow-right me-2"></i>
            العودة للقائمة
        </a>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h5 class="mb-0">
            <i class="bi bi-form me-2"></i>
            بيانات العميل
        </h5>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="name" class="form-label">اسم العميل <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label for="client_type" class="form-label">نوع العميل <span class="text-danger">*</span></label>
                    <select class="form-select" id="client_type" name="client_type" required>
                        <option value="">اختر نوع العميل</option>
                        <option value="individual">فرد</option>
                        <option value="company">شركة</option>
                    </select>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="platform_registration_number" class="form-label">رقم التسجيل بالمنصة <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="platform_registration_number" name="platform_registration_number" required>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label for="password" class="form-label">كلمة المرور <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="password" name="password" required>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="tax_office" class="form-label">المأمورية <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="tax_office" name="tax_office" required>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label for="national_id" class="form-label">الرقم القومي <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="national_id" name="national_id" required>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="tax_registration_number" class="form-label">رقم التسجيل الضريبي</label>
                    <input type="text" class="form-control" id="tax_registration_number" name="tax_registration_number" placeholder="اختياري">
                </div>
                
                <div class="col-md-6 mb-3">
                    <label for="declaration_status" class="form-label">حالة الإقرار</label>
                    <select class="form-select" id="declaration_status" name="declaration_status">
                        <option value="pending">معلق</option>
                        <option value="in_progress">قيد التنفيذ</option>
                        <option value="completed">مكتمل</option>
                    </select>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="employee_id" class="form-label">الموظف المسؤول</label>
                    <select class="form-select" id="employee_id" name="employee_id">
                        <option value="">اختر الموظف المسؤول</option>
                        {% for employee in employees %}
                        <option value="{{ employee.id }}">{{ employee.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle me-2"></i>
                    حفظ البيانات
                </button>
                <a href="{{ url_for("clients.index") }}" class="btn btn-secondary">
                    <i class="bi bi-x-circle me-2"></i>
                    إلغاء
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
